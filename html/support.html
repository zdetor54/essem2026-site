<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support – ESSEM 2026</title>
    <link rel="icon" type="image/png" href="../static/assets/essem_logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div id="nav-placeholder"></div>
    <main class="container my-5">
        <h1 class="mb-4">ESSEM 2026 - Financial Support</h1>
        <div class="mb-4">
            <p>We would like to thank our sponsors for their generous support without which this event would not have been possible.</p>
        </div>
        <div class="row row-cols-2 g-4 mb-4 text-center justify-content-center mx-auto mt-5" style="max-width:600px;">
            <div class="col">
                <a href="https://pupil-labs.com/" target="_blank" rel="noopener" class="sponsor-logo-link d-flex align-items-center justify-content-center h-100 p-3 border rounded bg-white">
                    <img src="../static/assets/sponsors/pupil-labs.jpg" alt="Pupil Labs" class="img-fluid" style="max-height:80px;">
                </a>
            </div>
            <div class="col">
                <a href="https://www.neuroclues.com/en/" target="_blank" rel="noopener" class="sponsor-logo-link d-flex align-items-center justify-content-center h-100 p-3 border rounded bg-white">
                    <img src="../static/assets/sponsors/neuroclues.png" alt="neuroClues" class="img-fluid" style="max-height:80px;">
                </a>
            </div>
            <div class="col">
                <a href="https://www.tobii.com/" target="_blank" rel="noopener" class="sponsor-logo-link d-flex align-items-center justify-content-center h-100 p-3 border rounded bg-white">
                    <img src="../static/assets/sponsors/tobii.svg" alt="Tobii" class="img-fluid" style="max-height:80px;">
                </a>
            </div>
            <div class="col">
                <a href="https://www.sr-research.com/" target="_blank" rel="noopener" class="sponsor-logo-link d-flex align-items-center justify-content-center h-100 p-3 border rounded bg-white">
                    <img src="../static/assets/sponsors/eyelink.png" alt="SR Research EyeLink" class="img-fluid" style="max-height:80px;">
                </a>
            </div>
        </div>

        
    </main>
    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function loadHTML(id, url) {
      fetch(url)
        .then(res => res.text())
        .then(data => { 
            document.getElementById(id).innerHTML = data; 
            if (id === 'nav-placeholder') {
                setActiveNav();
            }
        });
    }
    function setActiveNav() {
        var path = window.location.pathname.split('/').pop() || 'index.html';
        var navLinks = document.querySelectorAll('#main-nav .nav-link');
        navLinks.forEach(function(link) {
            var href = link.getAttribute('href');
            if (href === path) {
                link.classList.add('active');
                link.setAttribute('aria-current', 'page');
            } else {
                link.classList.remove('active');
                link.removeAttribute('aria-current');
            }
        });
    }
    loadHTML('nav-placeholder', 'nav.html');
    loadHTML('footer-placeholder', 'footer.html');
    </script>
</body>
</html>
